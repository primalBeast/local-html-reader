<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local HTML Reader × 2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 5px 1fr;
        height: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #0b0d12;
      }
      .gap {
        background: #2a3140;
      }
    </style>
  </head>
  <body>
    <div class="pair">
      <iframe src="/" title="Local HTML Reader left"></iframe>
      <div class="gap" aria-hidden="true"></div>
      <iframe src="/" title="Local HTML Reader right"></iframe>
    </div>
  </body>
</html>
